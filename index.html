<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout idea: a printed to-do sheet. Greige page, one white ruled table with a navy header band, index tabs on top. Single theme by choice. */
:root{
  color-scheme:light;
  --page:#e4d9d4;
  --sheet:#ffffff;
  --navy:#1d4a60;
  --navy-soft:#dfe8ec;
  --ink:#1f3440;
  --muted:#6a7f8a;
  --done:#f3ece8;
  --font-display:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,monospace;
  --font-body:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:16px}

header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.icon{width:64px;height:64px;border-radius:16px;background:var(--sheet);object-fit:cover;flex:none}
.titles{display:flex;flex-direction:column;gap:2px;min-width:0}
h1{font-family:var(--font-display);font-weight:400;color:var(--navy);font-size:34px;line-height:1.25;letter-spacing:.04em;margin:0}
.nb{white-space:nowrap}
h1 svg{width:34px;height:34px;vertical-align:-4px;margin-left:8px}
.lede{margin:0;color:var(--navy);font-size:14px}

.summary{display:flex;flex-direction:column;gap:6px;color:var(--navy)}
.summary-row{display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:space-between;align-items:baseline}
.big{font-size:20px}
.big b,.left b{font-weight:400;font-variant-numeric:tabular-nums}
.left{font-size:14px}
.bar{height:10px;background:var(--sheet);border:1px solid var(--navy);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--navy);transition:width .25s ease}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--navy);background:var(--sheet)}
.seg button{font:inherit;font-size:13px;color:var(--navy);background:transparent;border:0;border-left:1px solid var(--navy);padding:7px 12px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--sheet)}
.controls input[type="search"],.controls select{font:inherit;font-size:13px;color:var(--ink);background:var(--sheet);border:1px solid var(--navy);border-radius:0;padding:7px 10px;min-width:0}
.controls input[type="search"]{flex:1 1 160px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:-17px;padding-left:1px}
.tab{font:inherit;color:var(--navy);background:var(--navy-soft);border:1px solid var(--navy);border-bottom:0;border-radius:10px 10px 0 0;padding:8px 14px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.tab .n{font-size:12px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--navy);color:var(--sheet)}

.sheet{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--navy);table-layout:fixed}
th{background:var(--navy);color:var(--sheet);font-weight:400;font-size:13px;padding:8px 6px;border-left:1px solid var(--sheet);text-align:center}
th:first-child{border-left:0}
td{border-top:1px solid var(--navy);border-left:1px solid var(--navy);padding:9px 10px;vertical-align:middle}
td:first-child{border-left:0}
.c-check{width:52px;text-align:center}
.c-date{width:108px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.c-time{width:84px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
td.c-title a{color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
td.c-title a:hover{color:var(--navy);text-decoration:underline}
.sub{display:none;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
td input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border:2px solid var(--navy);background:var(--sheet);cursor:pointer;display:inline-grid;place-content:center;vertical-align:middle}
td input:checked{background:var(--navy)}
td input:checked::after{content:"";width:6px;height:12px;border:solid var(--sheet);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
tr.done td{background:var(--done)}
tr.done td.c-title a{color:var(--muted);text-decoration:line-through}
.empty td{text-align:center;color:var(--muted);padding:28px 12px}
.status{font-size:12px;color:var(--navy);margin:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
@media (max-width:560px){
  h1{font-size:24px} h1 svg{width:26px;height:26px}
  .icon{width:52px;height:52px;border-radius:13px}
  .c-date,.c-time{display:none}
  .sub{display:block}
  .c-check{width:46px}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

  <p class="status" id="status">チェックはこのブラウザに保存されます。スマホとパソコンでは別々です。</p>
</div>

<script>
(function(){
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var CHS = ['hayashi','bird'];
  var state = { ch:'hayashi', filter:'all', q:'', sort:'new' };
  var watched = {};
  var LS_KEY = 'watchlist-watched-v1';
  var canStore = true;

  var $ = function(id){ return document.getElementById(id); };
  var listEl = $('list');

  function tc(s){
    var h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
    return h + ':' + (m<10?'0':'') + m + ':' + (x<10?'0':'') + x;
  }
  function loadLocal(){
    try { var v = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); if (v && typeof v === 'object') return v; }
    catch(e){ canStore = false; }
    return {};
  }
  function saveLocal(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(watched)); }
    catch(e){
      if (canStore){ canStore = false; $('status').textContent = 'このブラウザではチェックを保存できません。ページを閉じると消えます。'; }
    }
  }

  function visible(){
    var q = state.q.trim().toLowerCase();
    var rows = DATA[state.ch].filter(function(v){
      if (state.filter === 'todo' && watched[v.id]) return false;
      if (state.filter === 'done' && !watched[v.id]) return false;
      if (q && v.t.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    var s = state.sort;
    rows.sort(function(a,b){
      if (s === 'new') return a.d < b.d ? 1 : a.d > b.d ? -1 : 0;
      if (s === 'old') return a.d < b.d ? -1 : a.d > b.d ? 1 : 0;
      if (s === 'short') return a.s - b.s;
      return b.s - a.s;
    });
    return rows;
  }

  function renderSummary(){
    CHS.forEach(function(ch){
      var all = DATA[ch], done = all.filter(function(v){ return watched[v.id]; }).length;
      $('n-'+ch).textContent = done + '/' + all.length;
    });
    var all = DATA[state.ch], done = 0, leftSec = 0, totalSec = 0;
    all.forEach(function(v){ totalSec += v.s; if (watched[v.id]) done++; else leftSec += v.s; });
    $('sum-done').textContent = done;
    $('sum-total').textContent = all.length;
    $('sum-left').textContent = all.length - done;
    $('sum-time').textContent = tc(leftSec);
    $('bar').style.width = (totalSec ? (totalSec - leftSec) / totalSec * 100 : 0) + '%';
  }

  function cell(cls){ var td = document.createElement('td'); td.className = cls; return td; }

  function renderList(){
    var rows = visible();
    listEl.textContent = '';
    if (!rows.length){
      var tr = document.createElement('tr'); tr.className = 'empty';
      var td = document.createElement('td'); td.colSpan = 4;
      td.textContent = state.q ? 'その名前の動画は見つかりませんでした。' :
        state.filter === 'todo' ? 'このチャンネルはぜんぶ見ました！' : 'チェックした動画はまだありません。';
      tr.appendChild(td); listEl.appendChild(tr);
      return;
    }
    var frag = document.createDocumentFragment();
    rows.forEach(function(v){
      var tr = document.createElement('tr');
      if (watched[v.id]) tr.className = 'done';
      var c1 = cell('c-check');
      var cb = document.createElement('input');
      cb.type = 'checkbox'; cb.id = 'c-' + v.id; cb.checked = !!watched[v.id];
      cb.setAttribute('aria-label', '見た：' + v.t);
      cb.addEventListener('change', function(){ toggle(v.id, cb.checked, tr); });
      c1.appendChild(cb);
      var c2 = cell('c-date'); c2.textContent = v.d.replace(/-/g,'/');
      var c3 = cell('c-title');
      var a = document.createElement('a');
      a.href = 'https://www.youtube.com/watch?v=' + v.id;
      a.target = '_blank'; a.rel = 'noopener';
      a.textContent = v.t;
      var sub = document.createElement('span');
      sub.className = 'sub'; sub.textContent = v.d.replace(/-/g,'/') + '・' + tc(v.s);
      c3.appendChild(a); c3.appendChild(sub);
      var c4 = cell('c-time'); c4.textContent = tc(v.s);
      tr.appendChild(c1); tr.appendChild(c2); tr.appendChild(c3); tr.appendChild(c4);
      frag.appendChild(tr);
    });
    listEl.appendChild(frag);
  }

  function render(){
    CHS.forEach(function(ch){ $('tab-'+ch).setAttribute('aria-selected', String(ch === state.ch)); });
    ['all','todo','done'].forEach(function(f){ $('f-'+f).setAttribute('aria-pressed', String(f === state.filter)); });
    renderSummary(); renderList();
  }

  function toggle(id, on, tr){
    if (on) watched[id] = true; else delete watched[id];
    saveLocal();
    if (state.filter === 'all') { tr.className = on ? 'done' : ''; renderSummary(); }
    else render();
  }

  function fromHash(){
    var h = (location.hash || '').replace('#','');
    if (CHS.indexOf(h) !== -1) state.ch = h;
  }
  CHS.forEach(function(ch){
    $('tab-'+ch).addEventListener('click', function(){
      state.ch = ch;
      try { location.hash = ch; } catch(e){}
      render();
    });
  });
  ['all','todo','done'].forEach(function(f){
    $('f-'+f).addEventListener('click', function(){ state.filter = f; render(); });
  });
  $('q').addEventListener('input', function(e){ state.q = e.target.value; renderList(); });
  $('sort').addEventListener('change', function(e){ state.sort = e.target.value; renderList(); });
  window.addEventListener('hashchange', function(){ fromHash(); render(); });

  watched = loadLocal();
  fromHash();
  render();
})();
</script>
